# ==============================

# 🧠 TMUX CONFIG - DEV SETUP

# ==============================

# 🔁 Prefixo mais confortável (Ctrl + a ao invés de Ctrl + b)

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ⚡ Responsividade

set -sg escape-time 0

# 🖱️ Mouse (redimensionar, clicar, scroll)

set -g mouse on

# 🎨 Cores (true color)

set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"

# 🔢 Index começa em 1 (mais natural)

set -g base-index 1
setw -g pane-base-index 1

# 🔄 Reload config rápido

bind r source-file ~/.tmux.conf ; display "Config recarregado!"

# ==============================

# 🧭 Navegação estilo VIM

# ==============================

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alternar pane anterior

bind Tab last-pane

# ==============================

# 🧱 Splits mais intuitivos

# ==============================

# | vertical

bind | split-window -h

# - horizontal

bind - split-window -v

# ==============================

# 📏 Resize rápido

# ==============================

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ==============================

# 🪟 Sessões e janelas

# ==============================

# nova janela

bind c new-window

# fechar janela

bind x kill-window

# ==============================

# 🎨 Status bar bonita (minimal)

# ==============================

set -g status-position bottom
set -g status-style "bg=#1e1e2e fg=#cdd6f4"

set -g status-left "#[fg=#89b4fa]#S "
set -g status-right "#[fg=#a6e3a1]%H:%M "

set -g window-status-format "#[fg=#6c7086] #I:#W "
set -g window-status-current-format "#[fg=#f5c2e7] #I:#W "

# ==============================

# 🚀 Qualidade de vida

# ==============================

# não renomear automaticamente

set-option -g allow-rename off

# histórico maior

set -g history-limit 10000

# copiar estilo vim

setw -g mode-keys vi
